name: baltic_deals_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.4.0+7

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  mobile_scanner: ^5.2.3
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.1
  cached_network_image: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/baltic_deals_full_2048.png
    - assets/icon/baltic_deals_icon_1024.png
    - assets/background/baltic-deals-bg-new.png
    - assets/background/baltic-deals-bg.png
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/baltic_deals_icon_1024.png"
  web:
    generate: true
    image_path: "assets/icon/baltic_deals_icon_1024.png"
    background_color: "#F57C00"
    theme_color: "#F57C00"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/baltic_deals_icon_1024.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/icon/baltic_deals_icon_1024.png
